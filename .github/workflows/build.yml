name: Build Rust Modules
on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - '**'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc

          # Linux (glibc)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true

          # Linux (musl - для Alpine Docker)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - host: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            cross: true

          # Android
          - host: ubuntu-latest
            target: aarch64-linux-android
            cross: true
          - host: ubuntu-latest
            target: armv7-linux-androideabi
            cross: true

    name: build-${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - name: Install Zig
        if: ${{ matrix.settings.cross }}
        uses: goto-bus-stop/setup-zig@v2

      - name: Build
        shell: bash
        run: |
          # Общие флаги CLI
          ARGS="--release --target ${{ matrix.settings.target }}"
          
          if [ "${{ matrix.settings.cross }}" == "true" ]; then
            ARGS="$ARGS --cross-compile"
          fi
          
          # MACOS:
          if [[ "${{ matrix.settings.target }}" == *"-apple-darwin"* ]]; then
            export RUSTFLAGS="-C link-args=-Wl,-undefined,dynamic_lookup"
          fi
          
          cargo build $ARGS

      - name: Prepare native build folder
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.settings.target }}"
          OUT_DIR="target/${TARGET}/release"

          echo "Looking for artifacts in: $OUT_DIR"
          ls -la "$OUT_DIR" || true

          mkdir -p build

          # Копируем всё, что нужно отдать наружу
          cp -v "$OUT_DIR"/*.exe build/ 2>/dev/null || true
          cp -v "$OUT_DIR"/sthp     build/ 2>/dev/null || true
          cp -v "$OUT_DIR"/sthp.exe build/ 2>/dev/null || true

          echo "----- build/ contents -----"
          ls -la build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: build/
          if-no-files-found: error
          retention-days: 14